# Future CI for the public repository (prepared, NOT required: `npm run validate:distribution` is the source of truth
# and runs locally). Do not enable on a private repository with no Actions budget.
# Actions are pinned to full commit SHAs (resolved with `git ls-remote` on 2026-10-26); review them and their inputs
# before enabling, and update pins deliberately.
name: validate-distribution
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu-24-04-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm run validate:distribution
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-results
          path: validation-results/
          retention-days: 14
